<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stjörnubær</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stjörnubær">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e8f0ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: a little town of tappable buildings; each building opens its own view (house, shops, school). Deliberately one bright light look. */
:root {
  --page: #e8f0ff;
  --ink: #2b2340;
  --muted: #6c6488;
  --card: #ffffff;
  --line: #d9d3ee;
  --coral: #ff6f61;
  --gold: #ffc83d;
  --mint: #4fc59a;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 16px; }
button { font-family: var(--body); color: var(--ink); }
button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

.app {
  max-width: none; margin: 0 auto; box-sizing: border-box;
  padding-block: 12px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.top { display: flex; align-items: center; gap: 10px; }
.back { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 800; cursor: pointer; white-space: nowrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6.5vw, 34px); line-height: 1; margin: 0 auto 0 0; min-width: 0; }
.coins { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 6px 14px 6px 10px; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.coins .st { color: var(--gold); font-size: 22px; line-height: 1; -webkit-text-stroke: 1px #c99512; }
.coins.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.15); } }

/* bærinn */
.sky { border-radius: 22px; overflow: hidden; border: 3px solid var(--ink); background: #bfe3ff; }
.sky svg { display: block; width: 100%; height: auto; }
.intro { margin: 0; color: var(--muted); font-weight: 700; line-height: 1.45; max-width: 62ch; }
.town { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 700px) { .town { grid-template-columns: repeat(4, 1fr); } }
.bld { position: relative; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px 10px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.bld:hover { border-color: var(--coral); }
.bld svg { width: 100%; max-width: 150px; height: auto; overflow: visible; }
.bld .nm { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.1; }
.bld .sub { font-size: 13px; font-weight: 700; color: var(--muted); }
.bld .sale { position: absolute; top: 8px; right: 8px; background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px; font-weight: 800; font-size: 13px; }
.bld.locked svg { opacity: .55; }
.town.places .bld:first-child { grid-column: 1 / -1; }
@media (min-width: 700px) { .town.places { grid-template-columns: repeat(5, 1fr); } .town.places .bld:first-child { grid-column: auto; } }
.mkprev { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; align-items: end; background: #fff0f6; border-radius: 18px; padding: 14px; }
.mkprev svg { width: 100%; height: auto; max-height: 260px; }
.mkprev .face { background: #fff; border-radius: 14px; border: 2px solid #ffd1e3; }
.mkprev, .preview { position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 5; box-shadow: 0 6px 16px rgba(43,35,64,.12); }
@media (max-width: 879px) { .mkprev svg { max-height: 170px; } .preview svg { width: auto; max-height: 180px; } }
.street { height: 14px; border-radius: 7px; background: repeating-linear-gradient(90deg, #6b6488 0 30px, #fff 30px 46px); opacity: .5; }

/* hús */
.house { display: grid; gap: 14px; }
@media (min-width: 880px) { .house { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.roomwrap { isolation: isolate; position: relative; width: min(100%, calc((100dvh - 200px) * .93)); margin: 0 auto; aspect-ratio: 4 / 4.3; max-width: 100%; border-radius: 22px; overflow: hidden; border: 3px solid var(--ink); }
.room { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; user-select: none; -webkit-user-select: none; overscroll-behavior-x: contain; }
.roomin { position: relative; height: 100%; min-width: 100%; }
.wall { position: absolute; inset: 0 0 36% 0; background-image: radial-gradient(rgba(255,255,255,.45) 2px, transparent 2.6px); background-size: 24px 24px; }
.wall svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: #fff; border-top: 2px solid var(--ink); opacity: .9; }
.floor { position: absolute; inset: 64% 0 0 0; background-image: repeating-linear-gradient(0deg, rgba(43,35,64,.12) 0 2px, transparent 2px 24px); }
.item { position: absolute; transform: translate(-50%, -100%); touch-action: none; cursor: grab; }
.item .in { display: block; }
.item.flip .in { transform: scaleX(-1); }
.item svg { display: block; width: 100%; height: auto; overflow: visible; pointer-events: none; transform-origin: 50% 100%; }
.item.sel { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 5px var(--coral)); }
.squish { animation: squish .5s ease-out; }
@keyframes squish { 30% { transform: scale(1.28, .7); } 60% { transform: scale(.9, 1.12); } 100% { transform: none; } }
.hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(255,255,255,.92); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; pointer-events: none; z-index: 200; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; min-height: 44px; }
.tools .name { font-weight: 800; margin-right: auto; }
.tools .empty { color: var(--muted); font-weight: 700; font-size: 14px; }
.sbtn { border: 2px solid var(--line); background: #f6f3ff; border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 14px; cursor: pointer; }
.sbtn.warn { background: #fff1ef; border-color: #ffc9c2; }

.panel { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sec h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.card { position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff; }
.thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f4f1fc; border-radius: 10px; border: 0; padding: 0; cursor: pointer; }
.thumb svg { width: 72%; height: 72%; overflow: visible; transform-origin: 50% 90%; }
.card .nm { font-weight: 800; font-size: 14px; text-align: center; }
.cnt { position: absolute; top: 4px; right: 4px; background: var(--coral); color: #fff; border-radius: 999px; font-weight: 800; font-size: 12px; padding: 1px 7px; }
.got { position: absolute; top: 4px; left: 4px; background: var(--mint); color: #fff; border-radius: 999px; font-weight: 800; font-size: 11px; padding: 1px 7px; }
.buy { width: 100%; border: 0; border-radius: 10px; padding: 7px 4px; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--mint); color: #fff; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.opt[aria-pressed="true"] { border-color: var(--coral); background: #fff1ef; }
.opt .price { color: #b8860b; font-size: 13px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; position: relative; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--coral); }
.sw .lock { position: absolute; right: -8px; bottom: -6px; background: var(--gold); border-radius: 999px; font-size: 10px; font-weight: 800; padding: 1px 4px; border: 1.5px solid var(--ink); color: var(--ink); }
.muted { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.45; }
.preview { display: flex; justify-content: center; background: #f4f1fc; border-radius: 18px; padding: 14px; }
.preview svg { width: 140px; height: auto; }
.progress-txt { font-weight: 800; }

/* skóli */
.school { display: grid; gap: 12px; }
@media (min-width: 640px) { .school { grid-template-columns: 1fr 1fr; } }
@media (min-width: 640px) { .school { grid-template-columns: repeat(3, 1fr); } }
.who { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.pcard { border: 3px solid var(--line); background: #f6f3ff; border-radius: 18px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pcard.on { border-color: var(--coral); background: #fff1ef; }
.pcard svg { width: 70px; height: auto; }
.pcard .pn { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; text-align: center; word-break: break-word; }
.pcard .ps { font-size: 13px; font-weight: 800; color: var(--muted); }
.pnew { border-style: dashed; justify-content: center; min-height: 150px; font-weight: 800; color: var(--muted); }
.nameinp { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 12px; padding: 12px; font: 700 18px var(--body); }
.linkbtn { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px; }
.savewarn { background: #fff1ef; border: 2px solid #ffb3ab; color: #b03a2e; border-radius: 14px; padding: 10px 14px; font-weight: 800; margin: 0; }
.savehint { color: #2f6fb0; font-weight: 800; margin: 6px 0 0; }
.codebox { width: 100%; box-sizing: border-box; min-height: 90px; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; resize: vertical; }
.golfwrap { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.golfbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.golfbar span { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.golfcv { display: block; width: min(100%, calc((100dvh - 250px) * 600 / 340)); aspect-ratio: 600 / 340; margin: 0 auto; border-radius: 18px; border: 3px solid var(--ink); touch-action: none; background: #4fae6a; cursor: crosshair; }
.golfmsg { text-align: center; align-items: center; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 8px 6px; border-radius: 16px; background: #f6f3ff; }
.badge.on { background: #fff8e1; }
.badge svg { width: 62px; height: auto; }
.badge .bn { font-weight: 800; font-size: 14px; line-height: 1.15; }
.badge .bd { font-size: 12px; color: var(--muted); line-height: 1.25; }
.bar { width: 100%; height: 7px; border-radius: 4px; background: #e3def2; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mint); }
.cb { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, 440px); margin: 0 auto; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; }
.sqr { aspect-ratio: 1; border: 0; padding: 0; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: min(8.4vw, 44px); line-height: 1; background: #fff1dc; }
.sqr.dk { background: #c98f5a; }
.sqr.sel { box-shadow: inset 0 0 0 4px #ffd34d; }
.sqr.good { box-shadow: inset 0 0 0 5px #4fc59a; }
.sqr.bad { box-shadow: inset 0 0 0 5px #ff6f61; }
.pc { font-family: "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", sans-serif; pointer-events: none; }
.pc.w { color: #fff; text-shadow: 0 0 1px #2b2340, 0 0 1px #2b2340, 1px 1px 0 #2b2340, -1px -1px 0 #2b2340, 1px -1px 0 #2b2340, -1px 1px 0 #2b2340; }
.pc.b { color: #2b2340; }
.coord { position: absolute; font-size: 10px; font-weight: 800; opacity: .55; color: #2b2340; pointer-events: none; }
.coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
.ans.sm { font-size: 19px; padding: 14px 8px; }
.qvis { display: flex; justify-content: center; }
.qvis svg { width: min(170px, 50%); height: auto; }
.seq { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 8vw, 40px); text-align: center; font-variant-numeric: tabular-nums; }
.seq b { color: var(--coral); }
.big { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; text-align: left;
  border: 3px solid var(--ink); border-radius: 20px; padding: 18px; cursor: pointer; box-shadow: 0 5px 0 var(--ink); display: flex; flex-direction: column; gap: 6px; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.big small { font-family: var(--body); font-size: 15px; font-weight: 700; }
.big.math { background: var(--gold); } .big.read { background: #9fd8f5; }

/* gluggi yfir */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(43,35,64,.55); display: flex; align-items: center; justify-content: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.sheet { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: #fff; border: 3px solid var(--ink); border-radius: 24px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; line-height: 1.05; text-wrap: balance; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 130px; }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: #ece9f5; }
.dots i.ok { background: var(--mint); } .dots i.no { background: #ffb3ab; }
.prob { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 12vw, 56px); text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; overflow-wrap: anywhere; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answers.col { grid-template-columns: 1fr; }
.ans { border: 3px solid var(--line); background: #f8f6ff; border-radius: 16px; padding: 16px 6px; font: 800 26px var(--body); font-variant-numeric: tabular-nums; cursor: pointer; }
.answers.col .ans { font-size: 17px; padding: 12px 14px; text-align: left; }
.ans.right { background: #e3f8ef; border-color: var(--mint); }
.ans.wrong { background: #fff1ef; border-color: var(--coral); }
.fb { min-height: 24px; text-align: center; font-weight: 800; font-size: 18px; margin: 0; }
.fb.good { color: #1f9a6c; } .fb.bad { color: #d64535; }
.prim { border: 3px solid var(--ink); background: var(--mint); color: #fff; border-radius: 14px; padding: 12px; font-weight: 800; font-size: 17px; cursor: pointer; }
.sec2 { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; font-weight: 800; font-size: 16px; cursor: pointer; }
.reward { text-align: center; font-family: var(--display); font-weight: 800; font-size: 44px; color: #c99512; margin: 0; }
.story { background: #fffaf0; border: 2px solid #f1e3c4; border-radius: 16px; padding: 16px 18px; }
.story h3 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 8px; }
.story p { margin: 0; font-size: 18px; line-height: 1.65; }
.qtext { font-weight: 800; font-size: 18px; margin: 0; }

.ask { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; background: #fff; border-top: 3px solid var(--ink);
  padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(43,35,64,.2); }
.ask p { margin: 0; font-weight: 800; font-size: 17px; text-align: center; }
.ask .row { max-width: 480px; margin: 0 auto; width: 100%; }
.toast { position: fixed; z-index: 70; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 800; white-space: nowrap; pointer-events: none; }
/* kort */
.mapbox { position: relative; }
.mapwrap { overflow-x: auto; overflow-y: hidden; border-radius: 22px; border: 3px solid var(--ink); background: #9fd3ff;
  height: max(300px, calc(100vh - 210px)); height: max(300px, calc(100dvh - 210px)); overscroll-behavior-x: contain; cursor: grab; user-select: none; -webkit-user-select: none; }
.mapwrap.panning { cursor: grabbing; }
.mapwrap svg { display: block; }
.spot { cursor: pointer; transform-box: fill-box; transform-origin: 50% 100%; transition: transform .18s; outline: none; }
.spot:hover, .spot:focus-visible { transform: translateY(-5px); }
.spot:focus-visible .lbl rect { stroke: var(--coral); stroke-width: 3; }
.forsale { filter: saturate(.3) brightness(1.06); }
.cloud { animation: drift 26s ease-in-out infinite alternate; }
.cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
@keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(70px); } }
.mapme { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.smoke { animation: smoke 3s ease-in-out infinite; }
@keyframes smoke { 50% { transform: translateY(-6px); opacity: .5; } }
.mapzoom { position: absolute; right: 14px; top: 14px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
@media (max-width: 640px) { .maphint { top: 60px !important; } }
.maphint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(255,255,255,.95); border: 2px solid var(--ink);
  border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 14px; pointer-events: none; white-space: nowrap; }
.mapinfo { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-start; }
.mapinfo > * { flex: 1 1 300px; min-width: 0; }
.roomtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.rt { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 15px; white-space: nowrap; cursor: pointer; }
.rt span { margin-left: 7px; font-size: 12px; background: #ece9f5; border-radius: 999px; padding: 1px 7px; }
.rt[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.rt[aria-pressed="true"] span { background: rgba(255,255,255,.22); }
/* hillur í búðum */
.grid.shelf { background: var(--shelfbg, #fff3e3); border-radius: 16px; padding: 14px 10px 10px; column-gap: 0; row-gap: 16px; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.grid.shelf .card { border: 0; border-radius: 0; background: transparent; padding: 0 0 2px; gap: 5px; }
.grid.shelf .thumb { background: transparent; border-radius: 0; aspect-ratio: auto; height: 104px; align-items: flex-end; border-bottom: 9px solid #c98f5a; box-shadow: 0 5px 0 -1px #a8703f; padding-bottom: 2px; }
.grid.shelf .thumb svg { width: 76%; height: 88px; }
.grid.shelf .buy, .grid.shelf .nm { width: calc(100% - 12px); }
.fridge { background: #f2f8ff; border: 3px solid var(--ink); border-radius: 18px; padding: 12px; box-shadow: inset 0 0 0 6px #fff; }
.fridge .card { background: rgba(255,255,255,.75); }
.fridge .row > * { flex: 1 1 0; }
.bubble { position: absolute; left: 30%; bottom: 100%; width: 40%; min-width: 20px; max-width: 44px; pointer-events: none; animation: bob 2.4s ease-in-out infinite; }
.bubble svg, .heartpop svg { display: block; width: 100%; height: auto; }
.heartpop { position: absolute; left: 35%; bottom: 90%; width: 30%; max-width: 34px; pointer-events: none; animation: heartup 1.1s ease-out forwards; }
@keyframes heartup { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-60px) scale(1.2); opacity: 0; } }
.flake { animation: fall linear infinite; }
@keyframes fall { from { transform: translateY(-60px); } to { transform: translateY(720px); } }
.big.daily { grid-column: 1 / -1; background: linear-gradient(90deg, #ffd34d, #ff9fb8); }
.big.daily:disabled { background: #e3f8ef; cursor: default; box-shadow: 0 5px 0 #9fd7bd; border-color: #9fd7bd; }
.garden { border-radius: 22px; border: 3px solid var(--ink); background: linear-gradient(#bfe3ff 0 22%, #8fd49e 22%); padding: 56px 14px 14px; position: relative; }
.garden::before { content: ""; position: absolute; left: 0; right: 0; top: 18%; height: 14px; background: repeating-linear-gradient(90deg, #fff 0 8px, transparent 8px 22px); opacity: .9; }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; position: relative; }
.bed { border: 3px solid #6b4428; background: #a8703f; border-radius: 16px; padding: 6px 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.bed svg { width: 100%; max-width: 110px; height: auto; display: block; }
.bed .lab { font-weight: 800; font-size: 13px; color: #fff; background: rgba(43,35,64,.55); border-radius: 999px; padding: 2px 8px; }
.bed .lab.need { background: #2f6fb0; }
.bed .lab.ready { background: #1f9a6c; }
.drops { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); width: 50%; pointer-events: none; animation: heartup 1s ease-in forwards; }
.sil svg { filter: brightness(0); opacity: .18; }
.hop { animation: hop .6s ease-out; }
@keyframes hop { 30% { transform: translateY(-16%) scale(1.03, .97); } 55% { transform: none; } 75% { transform: translateY(-5%); } }
.opt:disabled { opacity: .45; cursor: default; }
/* sundlaug */
.poolscene { position: relative; width: 100%; aspect-ratio: 400 / 250; border-radius: 22px; overflow: hidden; border: 3px solid var(--ink); }
.poolscene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.poolme { position: absolute; width: 11.5%; transform: translate(-50%, -100%); }
.poolme svg { display: block; width: 100%; height: auto; }
.poolme.wet { clip-path: inset(0 0 50% 0); }
.ripple { position: absolute; width: 15%; aspect-ratio: 3; border: 3px solid rgba(255,255,255,.9); border-radius: 50%; transform: translate(-50%, -50%); animation: ripple 1.6s ease-out infinite; }
@keyframes ripple { from { transform: translate(-50%, -50%) scale(.6); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.steam { animation: smoke 2.4s ease-in-out infinite; }
.poolbtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
/* ísbúð */
.iceprev { background: #fff0f6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 300px; }
.icebtn { border: 0; background: transparent; padding: 0; cursor: pointer; width: min(220px, 60%); }

.icebtn svg { display: block; width: 100%; height: auto; overflow: visible; transform-origin: 50% 90%; }

function renderPool() {
  poolAt = 'bakki'; poolBusy = false;
  $('view').innerHTML = `<div class="house"><div class="poolscene">${poolSVG()}<div class="ripple" id="ripple" hidden></div><div class="poolme" id="poolme">${avatarSVG(st.av)}</div></div>
    <div class="panel"><p class="muted">Sundlaugin er ókeypis! Prófaðu að stinga þér, renna þér og slaka á í heita pottinum.</p><div class="poolbtns">${POOLACT.map(([id, l]) => `<button class="sec2" data-pa="${id}">${l}</button>`).join('')}</div></div></div>`;
  poolPlace($('poolme'), PP.bakki);
  $('view').querySelectorAll('[data-pa]').forEach(b => b.onclick = () => poolGo(b.dataset.pa));
}
function poolGo(act) {
  const me = $('poolme'), rp = $('ripple'); if (!me || poolBusy) return;
  const wet = ['laug', 'laug2', 'pottur'].includes(poolAt);
  let path, end, endWet = true;
  if (act === 'dyfa') { path = [PP.bretti, [125, 88], [150, 168], PP.laug]; end = 'laug'; }
  else if (act === 'renna') { path = [PP.stigi, PP.toppur, [290, 80], [268, 116], [244, 138], [232, 172], PP.laug2]; end = 'laug2'; }
  else if (act === 'synda') { end = poolAt === 'laug' ? 'laug2' : 'laug'; path = wet && poolAt !== 'pottur' ? [PP[end]] : [[300, 150], [280, 176], PP[end]]; }
  else if (act === 'pottur') { path = [[340, 200], PP.pottur]; end = 'pottur'; }
  else { path = [PP.bakki]; end = 'bakki'; endWet = false; }
  if (end === poolAt && act !== 'synda') return;
  poolBusy = true; me.classList.remove('wet'); rp.hidden = true;
  const frames = [PP[poolAt], ...path].map(([x, y]) => ({ left: x / 4 + '%', top: y / 2.5 + '%' }));
  poolPlace(me, PP[end]); poolAt = end;
  const done = () => {
    poolBusy = false;
    if (!endWet) return;
    me.classList.add('wet');
    const [x, y] = PP[end]; rp.style.left = x / 4 + '%'; rp.style.top = (y - 35) / 2.5 + '%'; rp.hidden = false;
  };
  if (reduceMotion || !me.animate) return done();
  me.animate(frames, { duration: 420 * path.length, easing: 'ease-in-out' }).onfinish = done;
}

/* reikningur */
const QN = 5, REWARD = { 1: 3, 2: 5, 3: 7, 4: 9 };
const factors = L => L === 1 ? [rnd(2, 5), rnd(1, 10)] : L === 2 ? [rnd(2, 10), rnd(2, 10)] : L === 3 ? [rnd(3, 12), rnd(11, 25)] : [rnd(11, 25), rnd(11, 30)];
function makeQ() {
  const L = mathLevel(), kind = st.topic === 'mix' ? pick(['add', 'mul', 'div']) : st.topic;
  let q;
  if (kind === 'add') {
    const max = [0, 100, 1000, 10000, 100000][L];
    if (L >= 2 && Math.random() < 0.25) { const a = rnd(2, max), b = rnd(1, max); q = { text: `${fmt(a)} + ? = ${fmt(a + b)}`, answer: b }; }
    else if (Math.random() < 0.5) { const a = rnd(2, max), b = rnd(1, max); q = { text: `${fmt(a)} + ${fmt(b)} = ?`, answer: a + b }; }
    else { const a = rnd(Math.floor(max / 5), max), b = rnd(1, a); q = { text: `${fmt(a)} − ${fmt(b)} = ?`, answer: a - b }; }
  } else if (kind === 'mul') {
    let [a, b] = factors(L); if (Math.random() < 0.5) [a, b] = [b, a];
    q = (L >= 2 && Math.random() < 0.3) ? { text: `? × ${b} = ${fmt(a * b)}`, answer: a, a, b } : { text: `${a} × ${b} = ?`, answer: a * b, a, b };
  } else { const [a, b] = factors(L); q = { text: `${fmt(a * b)} ÷ ${a} = ?`, answer: b, a, b }; }
  const set = new Set([q.answer]);
  const c = [q.answer + 1, q.answer - 1, q.answer + 2, q.answer - 2, q.answer + 10, q.answer - 10];
  if (q.a) c.push(q.answer + q.a, q.answer - q.a, q.answer + q.b, q.answer - q.b);
  for (const v of shuffle(c)) { if (set.size >= 4) break; if (v > 0) set.add(v); }
  while (set.size < 4) set.add(q.answer + rnd(3, 15));
  q.options = shuffle([...set]);
  return q;
}
const chipRow = (name, list, cur) => `<div class="opts">${list.map(([v, l]) => `<button class="opt" data-${name}="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;

    <div class="sec"><h3>Hvað viltu reikna?</h3>${chipRow('topic', [['mix','Blandað'],['add','Plús og mínus'],['mul','Margföldun'],['div','Deiling']], st.topic)}</div>
    <div class="sec"><h3>Erfiðleikastig</h3>${chipRow('level', [['auto', `Sjálfvirkt · nú stig ${adaptOf('math').lvl}`], [1,'Létt · ★3'], [2,'Miðlungs · ★5'], [3,'Erfitt · ★7'], [4,'Mjög erfitt · ★9']], st.levelMode === 'manual' ? st.level : 'auto')}<p class="muted" style="margin-top:6px">Sjálfvirkt stig hækkar þegar þér gengur vel og lækkar ef dæmin eru of erfið.</p></div>

  sheet.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { st.topic = b.dataset.topic; save(); mathSetup(); });

}
const dots = (n, res) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${res[k] === true ? 'ok' : res[k] === false ? 'no' : ''}"></i>`).join('')}</div>`;
function mathQ() {
  if (m.i >= QN) return done(QN, 5, 'Fleiri dæmi', mathQStart);
  m.q = makeQ(); m.locked = false;
  sheet.innerHTML = `${dots(QN, m.res)}<div class="prob">${m.q.text}</div>
    <div class="answers">${m.q.options.map((o, k) => `<button class="ans" id="ans${k}" data-v="${o}">${fmt(o)}</button>`).join('')}</div>
    <p class="fb" id="fb" aria-live="polite"></p><button class="prim" id="next" hidden>Áfram</button>`;
  sheet.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(b, Number(b.dataset.v) === m.q.answer, fmt(m.q.answer), REWARD[mathLevel()], mathQ));
  $('next').onclick = mathQ;
}
function mathQStart() { m = { type: 'math', i: 0, ok: 0, earned: 0, res: [] }; mathQ(); }

function answer(b, ok, correctText, reward, nextFn) {
  if (m.locked) return; m.locked = true;
  sheet.querySelectorAll('.ans').forEach(x => { x.disabled = true; if (x.dataset.ok === '1' || (x.dataset.v !== undefined && Number(x.dataset.v) === m.q?.answer)) x.classList.add('right'); });
  m.res[m.i] = ok; m.i++;
  adaptRecord(m.type, ok);
  const fb = $('fb');
  if (ok) {
    incStat('rett'); incStat('rett_' + m.type);
    m.ok++; m.earned += reward; addCoins(reward); save();
    fb.className = 'fb good'; fb.textContent = `${pick(['Rétt!', 'Frábært!', 'Snilld!', 'Vel gert!'])} +★${reward}`;
    setTimeout(nextFn, 900);
  } else {
    b.classList.add('wrong'); fb.className = 'fb bad'; fb.textContent = `Ekki alveg. Svarið er: ${correctText}`;
    $('next').hidden = false; $('next').focus();
  }
}
function done(n, bonusIfAll, againLabel, againFn) {
  let bonus = 0; if (m.ok === n) { bonus = bonusIfAll; addCoins(bonus); save(); }
  const lvlMsg = adaptCheck(m.type);
  sheet.innerHTML = `<h2>${m.ok === n ? 'Allt rétt!' : m.ok >= n / 2 ? 'Vel gert!' : 'Góð tilraun!'}</h2>${lvlMsg ? `<p class="savehint" style="text-align:center;font-size:16px">${lvlMsg}</p>` : ''}
    <p class="reward">+★ ${m.earned + bonus}</p>
    <p class="muted" style="text-align:center">Þú svaraðir ${m.ok} af ${n} rétt${bonus ? ` og fékkst ★ ${bonus} í bónus` : ''}. Þú átt núna ★ ${fmt(st.coins)}.</p>
    <div class="row"><button class="prim" id="dAgain">${againLabel}</button><button class="sec2" id="dTown">Í bæinn</button></div>`;
  $('dAgain').onclick = againFn;
  $('dTown').onclick = () => { ov.hidden = true; m = null; go('town'); };
  $('dAgain').focus();
}

/* lestur */
const READ_REWARD = 6;
function openRead() { openOv(); readStart(); }
function readStart() {
  const story = STORIES[st.readNext % STORIES.length];
  st.readNext++; save();
  m = { type: 'read', story, i: 0, ok: 0, earned: 0, res: [] };
  readQ();
}
function readQ() {
  const s = m.story, n = s.q.length;
  if (m.i >= n) return done(n, 4, 'Ný saga', readStart);
  const [qt, right, ...wrong] = s.q[m.i]; m.locked = false;
  const opts = shuffle([[right, 1], ...wrong.map(w => [w, 0])]);
  sheet.innerHTML = `<div class="story"><h3>${s.t}</h3><p>${s.p}</p></div>
    ${dots(n, m.res)}<p class="qtext">${m.i + 1}. ${qt}</p>
    <div class="answers col">${opts.map(([t, ok]) => `<button class="ans" data-ok="${ok}">${t}</button>`).join('')}</div>
    <p class="fb" id="fb" aria-live="polite"></p><button class="prim" id="next" hidden>Áfram</button>`;
  m.q = null;
  sheet.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(b, b.dataset.ok === '1', right, READ_REWARD, readQ));
  $('next').onclick = readQ;
  if (m.i === 0) sheet.scrollTop = 0;
}

const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
